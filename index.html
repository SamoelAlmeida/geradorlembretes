<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Lembretes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <div class="topo-painel">
      <h1>📌 Meus Lembretes</h1>
      <button id="btn-tema" type="button" aria-label="Alternar tema">🌙</button>
    </div>

    <div class="card-inputs">
      <div class="form-group">
        <label for="input-texto">Descrição do Lembrete:</label>
        <input type="text" id="input-texto" placeholder="Ex: Comprar leite no mercado...">
      </div>

      <div class="form-group">
        <label for="select-prioridade">Prioridade:</label>
        <select id="select-prioridade">
          <option value="baixa">Baixa</option>
          <option value="media">Média</option>
          <option value="alta">Alta</option>
        </select>
      </div>

      <button id="btn-adicionar">Adicionar Lembrete</button>
      <p id="msg-erro" class="erro"></p>
    </div>

    <div class="filtro-dropdown-container">
      <select id="select-filtro" class="btn-filtro-pequeno">
        <option value="todos">Filtrar: Todos</option>
        <option value="pendentes">Não Concluídos</option>
        <option value="concluidos">Concluídos</option>
        <option value="alta">Prioridade Alta</option>
        <option value="media">Prioridade Média</option>
        <option value="baixa">Prioridade Baixa</option>
      </select>
    </div>
    
    <section id="lista-lembretes" class="grid-lembretes"></section>

  </main>

  <script src="script2.js"></script>
</body>
</html>
